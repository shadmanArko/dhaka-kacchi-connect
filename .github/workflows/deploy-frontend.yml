name: Deploy frontend

# Only frontend changes trigger this - worker/** is excluded so a
# backend-only push never rebuilds/redeploys the site. See
# deploy-backend.yml for the mirror-image workflow.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/build-static.mjs"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Action majors are kept current because GitHub retires the Node runtime
      # underneath them: v4 of these targeted Node 20, which is deprecated and
      # only still running because GitHub force-runs it on Node 24. That grace
      # period ends on their schedule, not ours, and when it does the deploy
      # breaks with no warning.
      #
      # The breaking changes in these majors were each checked against how
      # THIS workflow uses them, and none apply:
      #   - checkout v5/v6/v7 restrict pull_request_target / workflow_run
      #     checkouts. This workflow triggers on push and workflow_dispatch
      #     only - it has no PR events at all.
      #   - upload-artifact v7 moved to ESM and added an optional `archive`
      #     input. The four inputs used below are unchanged, and `archive`
      #     is deliberately not set.
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      # Gates the deploy on the pure logic that has no other safety net:
      # the cart's restore guards and apiFetch's error sanitisation and
      # timeout handling. Until now CI shipped on typecheck + lint alone.
      - name: Test
        run: bun run test

      # Produces dist-static/ - see scripts/build-static.mjs for why this
      # isn't a plain `vite build`: Nitro's own static-prerender preset is
      # broken for TanStack Start in this dependency combo (tracked
      # upstream at https://github.com/TanStack/router/issues/4369), so
      # this builds a real server, fetches every route from it, and saves
      # the rendered HTML as static files instead.
      #
      # VITE_API_BASE_URL is baked in at build time (Vite inlines
      # import.meta.env.VITE_* into the bundle) - without it, src/lib/api.ts
      # falls back to an empty string and every request silently fails
      # against the frontend's own domain instead of the real backend.
      #
      # VITE_POSTHOG_KEY is safe to commit in plaintext: a PostHog project
      # token is a publishable client key ("Write-only key for use in
      # client libraries. Safe to use in public apps." per PostHog's own
      # settings page), not a secret - same reasoning as VITE_API_BASE_URL
      # above.
      # VITE_SENTRY_DSN is likewise publishable - a DSN ships inside every
      # browser bundle by construction and can only be used to send events
      # in. SENTRY_AUTH_TOKEN below is NOT publishable: it is a real repo
      # secret, and it is what gates source-map generation and upload (see
      # vite.config.ts). VITE_SENTRY_RELEASE must be the same value the
      # runtime SDK reports, or uploaded maps never match the events and
      # every stack frame silently stays minified.
      - name: Build static site
        env:
          VITE_API_BASE_URL: https://api.dhakakacchi.com
          VITE_POSTHOG_KEY: phc_mswvAnS2262YdsUypEMZWiiVDmqZWn4aSV5KSgw3yQip
          VITE_POSTHOG_HOST: https://eu.i.posthog.com
          VITE_SENTRY_DSN: https://4a7f4dd06d8207f18173c216d105370c@o4512084967358464.ingest.de.sentry.io/4512091504050256
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: dhaka-kacchi-frontend
        run: bun run build:static

      # dist-static/ is FTP'd verbatim into a public docroot, so a stray .map
      # would publish the entire frontend source. vite.config.ts is written so
      # maps are only ever generated when they are also deleted after upload -
      # this is the independent check that the two halves actually stayed in
      # sync, and it runs BEFORE anything is transferred.
      - name: Assert no source maps in deploy output
        run: |
          if [ -n "$(find dist-static -name '*.map' -print -quit)" ]; then
            echo "::error::source maps present in dist-static/ - refusing to deploy"
            find dist-static -name '*.map'
            exit 1
          fi
          echo "no source maps in dist-static/ - safe to deploy"

      # The rollback mechanism, and the only one there is.
      #
      # The FTP step below overwrites the live docroot in place: there is no
      # previous version on the server afterwards, and `dist-static/` is a
      # prerender of whatever the repo looked like at that commit, so it
      # cannot be reproduced later by checking the commit out again once a
      # dependency has moved. Keeping the exact uploaded bytes is what makes
      # "put yesterday's site back" a five-minute job instead of a rebuild
      # and a guess.
      #
      # This runs BEFORE the transfer on purpose - a deploy that dies halfway
      # through the upload is precisely when the last-good bundle is needed,
      # so the artifact must already exist by then.
      #
      # To roll back: open the last known-good run of this workflow, download
      # its `dist-static` artifact, unzip it, and upload the contents to the
      # same server-dir with any FTP client. 30 days covers the window in
      # which anyone would still want the old site; past that, rebuild.
      - name: Archive the deployed bundle for rollback
        uses: actions/upload-artifact@v7
        with:
          name: dist-static
          path: dist-static/
          retention-days: 30
          if-no-files-found: error

      # This Hostinger plan's hPanel exposes FTP on port 21 only, not SFTP -
      # see hPanel > Files > FTP Accounts. If the plan is ever upgraded to
      # real SFTP the secret names stay the same and only `protocol` changes.
      #
      # STILL TO DO, and the reason is recorded here rather than lost: this
      # step should be `protocol: ftps` with `security: loose`. That is
      # EXPLICIT FTPS (AUTH TLS on this same port 21), not SFTP, and it is
      # what stops the FTP password crossing the internet in cleartext on
      # every single deploy - which is what it does today. Three things were
      # established, because getting this wrong breaks the one path that
      # puts the site on the server:
      #
      #   1. The server accepts it. Probed directly against the live host:
      #      `AUTH TLS` returns 234 and it negotiates TLS 1.3.
      #   2. The certificate can never match. hPanel gives the FTP host as a
      #      bare IP, ftp.dhakakacchi.com resolves to that same address, and
      #      the server presents Hostinger's shared certificate -
      #      CN=hostinger.com, SAN *.hostinger.com plus country siblings.
      #      No value this secret could hold matches it, and the IP has no
      #      PTR record pointing at a hostinger.com name either.
      #   3. Which is why `security` is pinned to `loose` EXPLICITLY rather
      #      than left to the action's default. This is the honest tradeoff:
      #      loose still encrypts the session, it just doesn't reject the
      #      mismatched hostname. That defeats passive interception of the
      #      password - the realistic threat between a GitHub runner and
      #      shared hosting - but NOT an active man-in-the-middle, which no
      #      setting can defend against on a shared cert reached by IP.
      #      Do not "harden" this to `strict`: it cannot succeed here, and
      #      the only thing it would achieve is a failed deploy.
      #
      # The one thing still unproven is the DATA channel: some servers accept
      # TLS on the control connection yet refuse the passive data connection,
      # or require TLS session reuse. That cannot be tested without the
      # password, so verify the switch with `dry-run: true` on a
      # workflow_dispatch before trusting a real push. The failure mode is
      # loud and lands before files move, so it cannot silently half-update
      # the site, and the fix is simply `protocol: ftp` again.
      #
      # server-dir is "./", not "./public_html/" - this FTP account
      # (u669793404.dhakakacchi.com) is a domain-scoped Hostinger account
      # whose connection root IS ALREADY that domain's public_html. Using
      # "./public_html/" here created a nested public_html/public_html/
      # one level below the real docroot, so the live site never actually
      # updated - confirmed by comparing the real dhakakacchi.com/order
      # page (still the old WhatsApp-only site) against the file manager's
      # top-level public_html/ (unchanged) vs. a public_html/public_html/
      # subfolder that appeared right after a deploy run.
      - name: Deploy to Hostinger over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_SFTP_HOST }}
          port: ${{ secrets.HOSTINGER_SFTP_PORT }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist-static/
          server-dir: ./

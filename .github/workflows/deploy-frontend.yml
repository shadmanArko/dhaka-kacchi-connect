name: Deploy frontend

# Only frontend changes trigger this - worker/** is excluded so a
# backend-only push never rebuilds/redeploys the site. See
# deploy-backend.yml for the mirror-image workflow.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/build-static.mjs"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      # Gates the deploy on the pure logic that has no other safety net:
      # the cart's restore guards and apiFetch's error sanitisation and
      # timeout handling. Until now CI shipped on typecheck + lint alone.
      - name: Test
        run: bun run test

      # Produces dist-static/ - see scripts/build-static.mjs for why this
      # isn't a plain `vite build`: Nitro's own static-prerender preset is
      # broken for TanStack Start in this dependency combo (tracked
      # upstream at https://github.com/TanStack/router/issues/4369), so
      # this builds a real server, fetches every route from it, and saves
      # the rendered HTML as static files instead.
      #
      # VITE_API_BASE_URL is baked in at build time (Vite inlines
      # import.meta.env.VITE_* into the bundle) - without it, src/lib/api.ts
      # falls back to an empty string and every request silently fails
      # against the frontend's own domain instead of the real backend.
      #
      # VITE_POSTHOG_KEY is safe to commit in plaintext: a PostHog project
      # token is a publishable client key ("Write-only key for use in
      # client libraries. Safe to use in public apps." per PostHog's own
      # settings page), not a secret - same reasoning as VITE_API_BASE_URL
      # above.
      # VITE_SENTRY_DSN is likewise publishable - a DSN ships inside every
      # browser bundle by construction and can only be used to send events
      # in. SENTRY_AUTH_TOKEN below is NOT publishable: it is a real repo
      # secret, and it is what gates source-map generation and upload (see
      # vite.config.ts). VITE_SENTRY_RELEASE must be the same value the
      # runtime SDK reports, or uploaded maps never match the events and
      # every stack frame silently stays minified.
      - name: Build static site
        env:
          VITE_API_BASE_URL: https://api.dhakakacchi.com
          VITE_POSTHOG_KEY: phc_mswvAnS2262YdsUypEMZWiiVDmqZWn4aSV5KSgw3yQip
          VITE_POSTHOG_HOST: https://eu.i.posthog.com
          VITE_SENTRY_DSN: https://4a7f4dd06d8207f18173c216d105370c@o4512084967358464.ingest.de.sentry.io/4512091504050256
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: dhaka-kacchi-frontend
        run: bun run build:static

      # dist-static/ is FTP'd verbatim into a public docroot, so a stray .map
      # would publish the entire frontend source. vite.config.ts is written so
      # maps are only ever generated when they are also deleted after upload -
      # this is the independent check that the two halves actually stayed in
      # sync, and it runs BEFORE anything is transferred.
      - name: Assert no source maps in deploy output
        run: |
          if [ -n "$(find dist-static -name '*.map' -print -quit)" ]; then
            echo "::error::source maps present in dist-static/ - refusing to deploy"
            find dist-static -name '*.map'
            exit 1
          fi
          echo "no source maps in dist-static/ - safe to deploy"

      # This Hostinger plan's hPanel only exposes plain FTP (port 21), not
      # SFTP - see hPanel > Files > FTP Accounts. Same secret names either
      # way; only `protocol` changes if that plan is ever upgraded to SFTP.
      #
      # server-dir is "./", not "./public_html/" - this FTP account
      # (u669793404.dhakakacchi.com) is a domain-scoped Hostinger account
      # whose connection root IS ALREADY that domain's public_html. Using
      # "./public_html/" here created a nested public_html/public_html/
      # one level below the real docroot, so the live site never actually
      # updated - confirmed by comparing the real dhakakacchi.com/order
      # page (still the old WhatsApp-only site) against the file manager's
      # top-level public_html/ (unchanged) vs. a public_html/public_html/
      # subfolder that appeared right after a deploy run.
      - name: Deploy to Hostinger over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_SFTP_HOST }}
          port: ${{ secrets.HOSTINGER_SFTP_PORT }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist-static/
          server-dir: ./

name: Deploy backend

# Only backend changes trigger this - a frontend-only push never touches
# the VPS. See deploy-frontend.yml for the mirror-image workflow.
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Majors kept current for the same reason as deploy-frontend.yml: v4 of
      # these targeted Node 20, which GitHub now only runs by forcing it onto
      # Node 24, and that grace period ends on their schedule.
      #
      # fetch-depth: 2 is still required - the schema.sql check below diffs
      # HEAD against HEAD~1, which a depth-1 checkout cannot do.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # setup-node v5 began caching automatically when package.json carries a
      # `packageManager` field, which would be a behaviour change here.
      # Neither package.json in this repo has that field, and the cache is
      # configured explicitly below regardless, so the new default never
      # engages. v6 narrowed that automatic caching to npm; v7 moved to ESM.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Typecheck
        working-directory: worker
        run: npm run typecheck

      # The Friday-18:00-Berlin cutoff decides whether an order can be
      # placed at all - the highest-consequence pure logic here.
      - name: Test
        working-directory: worker
        run: npx --yes bun test src/

      # Deliberately does NOT run `npm run db:migrate` - schema.sql's
      # migration drops and recreates tables (see worker/CLAUDE.md), so it
      # must stay a deliberate, backed-up, human-run step, never automatic.
      - name: Warn if schema.sql changed
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^worker/schema\.sql$'; then
            echo "::warning::worker/schema.sql changed - run the migration manually, with a backup, per worker/CLAUDE.md. This workflow never runs db:migrate automatically."
          fi
        continue-on-error: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/dhaka-kacchi/dhaka-kacchi-connect
            git pull origin main
            cd /opt/dhaka-kacchi/dhaka_kacchi_ai_harness/deploy
            docker compose up -d --build ordering-backend
